<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sellout KPI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Theme follows the FAST KPI dashboards: blue #0057A0 primary, red #D62828 alert, Montserrat headings, Open Sans body.
   Traffic-light bands: green >=100%, yellow 90-99%, red <90%. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#13243A; --muted:#5A6A7E; --line:#DCE2EA; --hover:#EEF3F9;
  --blue:#0057A0; --blue-ink:#0057A0; --red:#D62828; --hdr:#0057A0; --on-fill:#FFFFFF; --tbar:rgba(0,87,160,.14);
  --s-g:#1E9E5A; --s-y:#F2C200; --s-r:#D62828; --i-g:#12703F; --i-y:#7A5A00; --i-r:#B01E1E;
  --font-h:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1520; --surface:#142030; --ink:#E7EDF5; --muted:#97A7BB; --line:#25364B; --hover:#1B2B3F;
    --blue:#4D9BE6; --blue-ink:#7DB6F0; --red:#FF6B6B; --hdr:#003A6C; --on-fill:#0C1520; --tbar:rgba(77,155,230,.22);
    --s-g:#3DC17A; --s-y:#F7D046; --s-r:#FF6464; --i-g:#6FD9A0; --i-y:#F2D56A; --i-r:#FF8E8E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1520; --surface:#142030; --ink:#E7EDF5; --muted:#97A7BB; --line:#25364B; --hover:#1B2B3F;
  --blue:#4D9BE6; --blue-ink:#7DB6F0; --red:#FF6B6B; --hdr:#003A6C; --on-fill:#0C1520; --tbar:rgba(77,155,230,.22);
  --s-g:#3DC17A; --s-y:#F7D046; --s-r:#FF6464; --i-g:#6FD9A0; --i-y:#F2D56A; --i-r:#FF8E8E; color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-b);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-h);margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.b-g{--c:var(--s-g);--ci:var(--i-g)} .b-y{--c:var(--s-y);--ci:var(--i-y)} .b-r{--c:var(--s-r);--ci:var(--i-r)}
.b-n{--c:var(--blue);--ci:var(--blue-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ci)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.wrap{max-width:1280px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

/* header */
.top{background:var(--hdr);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1280px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font:800 26px/1 var(--font-h);letter-spacing:.06em}
.brand span{font:600 10px/1 var(--font-h);letter-spacing:.28em;text-transform:uppercase;opacity:.85;margin-top:5px}
.ttl{flex:1 1 260px;min-width:0}
.ttl h1{font-size:20px;font-weight:700}
.ttl p{margin:2px 0 0;font-size:12.5px;opacity:.9}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#9AA7B8;flex:none}
.dot.ok{background:#47D68C}.dot.file{background:#F7C948}.dot.bad{background:#FF6B6B}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-fill)}
.btn.sm{padding:4px 10px;font-size:12px}
.top .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.26)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.swoosh{height:4px;background:linear-gradient(90deg,var(--red) 0 24%,transparent 24%)}
.bar{height:3px;background:transparent;overflow:hidden}
.bar.on{background:rgba(255,255,255,.25)}
.bar.on::after{content:"";display:block;height:100%;width:35%;background:#fff;animation:ld 1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* sticky filters */
.filters{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.f-in{max-width:1280px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px))}
.f-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.f-head h2{font:600 11px var(--font-h);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.f-head .grow{flex:1}
.f-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ms{position:relative}
.ms-b{display:flex;flex-direction:column;align-items:flex-start;min-width:150px;max-width:220px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.ms-b:hover{background:var(--hover)}
.ms-b.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.ms-l{font:600 10.5px var(--font-h);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ms-v{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-p{position:absolute;top:calc(100% + 4px);left:0;z-index:40;width:280px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:8px}
.ms-s,.inp{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.ms-all{display:flex;gap:8px;align-items:center;padding:8px 4px 4px;font-weight:600;font-size:13px;cursor:pointer}
.ms-list{max-height:240px;overflow:auto;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.ms-list label{display:flex;gap:8px;align-items:center;padding:4px;border-radius:5px;cursor:pointer;font-size:13px}
.ms-list label:hover{background:var(--hover)}
.ms-note{font-size:11.5px;color:var(--muted);padding:4px}
.dt{display:flex;flex-direction:column;padding:5px 10px;border:1px solid var(--line);border-radius:8px}
.dt span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.dt input{border:0;background:transparent;padding:0;font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 4px 2px 10px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue-ink);font-size:12px;font-weight:600}
.chip button{border:0;background:transparent;cursor:pointer;font-size:14px;line-height:1;padding:2px 6px;border-radius:50%}
.chip button:hover{background:color-mix(in srgb,var(--blue) 25%,transparent)}
#fToggle{display:none}
@media (max-width:720px){
  #fToggle{display:inline-block}
  .f-grid.closed{display:none}
  .ms{flex:1 1 calc(50% - 8px)} .ms-b{min-width:0;max-width:none;width:100%}
  .ms-p{left:0}
  .ms:nth-child(even) .ms-p{left:auto;right:0}
}

/* banner + kpis */
.banner{margin:14px 0 0;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);border-left:5px solid var(--red)}
.banner.info{border-left-color:var(--blue)}
.banner b{font-family:var(--font-h)}
.banner .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
main{padding:18px 0 48px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kpi .l{display:flex;align-items:center;gap:7px;font:600 11px var(--font-h);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .l i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.kpi .v{font:700 28px/1.1 var(--font-h);color:var(--ci,var(--ink));overflow-wrap:anywhere}
.kpi .v.sm{font-size:19px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.kpi .tr{font-size:12px;font-weight:600;margin-top:4px}
.tr.up{color:var(--i-g)}.tr.dn{color:var(--i-r)}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:3px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.wide{grid-column:1/-1}
.card-h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.card h2{font-size:15px;font-weight:700}
.sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sel{padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px}
.chart{width:100%;margin-top:8px}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.card.fs{position:fixed;inset:0;z-index:100;border-radius:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px))}
.card.fs .chart{height:calc(100vh - 220px)!important;min-height:320px}

/* insights */
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:900px){.ins{grid-template-columns:minmax(0,1fr)}}
.ins>div{border:1px solid var(--line);border-left:4px solid var(--c,var(--blue));border-radius:8px;padding:8px 10px;background:var(--bg)}
.ins b{display:block;font:700 11px var(--font-h);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.ins p{margin:0;font-size:12.8px;overflow-wrap:anywhere}
.ins .g{--c:var(--s-g)}.ins .y{--c:var(--s-y)}.ins .r{--c:var(--s-r)}
.ibox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.ibox h2{font-size:15px}
.ibox ul{margin:8px 0 0;padding-left:18px}
.ibox li{margin:4px 0}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--hover);font:600 11px var(--font-h);letter-spacing:.05em;text-transform:uppercase;z-index:1;cursor:pointer;user-select:none}
th:hover{color:var(--blue-ink)}
td.r,th.r{text-align:right}
tr:hover td{background:var(--hover)}
td.cell-g{color:var(--i-g);font-weight:700}td.cell-y{color:var(--i-y);font-weight:700}td.cell-r{color:var(--i-r);font-weight:700}
tr.vital td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:12.5px}
.pager .grow{flex:1}
.inp.s{max-width:260px}
.foot{font-size:12px;color:var(--muted);margin:18px 0 0}
.foot details{margin-top:8px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:8px}
.map-grid label{display:flex;flex-direction:column;font-size:11.5px;font-weight:600}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:200;max-width:90vw}
@media print{.filters,.tools,.top .live{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>FAST</b><span>Unimerchant</span></div>
    <div class="ttl"><h1>Sellout KPI Dashboard</h1><p id="updated">Loading data…</p></div>
    <div class="live">
      <span class="dot" id="dot"></span><span id="srcTxt"></span>
      <label class="chk"><input type="checkbox" id="auto"> Auto-refresh (5 min)</label>
      <button class="btn" id="refresh"><span class="spin" id="spin" hidden></span>Refresh Data</button>
      <button class="btn" id="pdf">Download PDF</button>
      <button class="btn" id="theme" aria-label="Toggle dark mode">Dark mode</button>
    </div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="swoosh"></div>
</header>

<section class="filters" aria-label="Filters">
  <div class="f-in">
    <div class="f-head">
      <h2>Filters</h2>
      <button class="btn sm" id="fToggle" aria-expanded="true">Show / hide</button>
      <span class="grow"></span>
      <span id="fInfo" class="sub"></span>
      <button class="btn sm" id="fClear">Clear all</button>
    </div>
    <div class="f-grid" id="fGrid"></div>
    <div class="chips" id="chips"></div>
  </div>
</section>

<div class="wrap">
  <div id="msg" class="banner" hidden></div>
  <main id="main" hidden>
    <section class="kpis" id="kpis" aria-label="Key performance indicators"></section>
    <section class="ibox" id="top-ins"><h2>Executive Insights</h2><ul id="topList"></ul></section>
    <section class="grid" id="cards"></section>

    <section class="card wide" id="card-pareto" style="margin-top:14px">
      <div class="card-h"><div><h2>Pareto Analysis: Top Customers Driving 80% of Sales</h2>
        <p class="sub" id="paretoSub">Customers ranked by actual sellout, with cumulative contribution.</p></div>
        <div class="tools"><button class="btn sm" data-png="pareto">PNG</button><button class="btn sm" data-fs="pareto">Full screen</button></div></div>
      <div class="chart" id="ch-pareto" style="height:400px"></div><div class="empty" id="em-pareto" hidden></div>
      <div class="ins" id="ins-pareto"></div>
      <div class="tw" id="paretoTbl"></div>
      <div class="pager"><button class="btn sm" id="paretoMore" hidden>Show all customers</button></div>
    </section>

    <section class="card wide" style="margin-top:14px" id="card-detail">
      <div class="card-h"><div><h2>Detail Records</h2><p class="sub" id="detSub"></p></div>
        <div class="tools"><button class="btn sm" id="xCsv">Export CSV</button><button class="btn sm primary" id="xXlsx">Export Excel</button></div></div>
      <div style="margin-top:10px"><input class="inp s" id="tq" type="search" placeholder="Search all columns…" aria-label="Search records"></div>
      <div class="tw" id="detTbl"></div>
      <div class="pager"><span id="pgInfo"></span><span class="grow"></span>
        <label>Rows <select class="sel" id="pgSize"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label>
        <button class="btn sm" id="pgPrev">Prev</button><span id="pgNum"></span><button class="btn sm" id="pgNext">Next</button></div>
    </section>
  </main>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" role="status" hidden></div>
<input type="file" id="file" accept=".csv,text/csv" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){'use strict';
/* ============================================================
   Sellout KPI Dashboard
   Modules: config > utils > data (detect/ingest) > filters > aggregation > insights > charts > table > export > app
   No dataset structure is hardcoded: columns are detected from the header row by name.
   ============================================================ */

/* ---------- config ---------- */
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQxYJVZKIkTB6AKZEcvosn3yx2u1Tad0Avb_Jp3NY92pBjKGfxYu_Qw1nh91t7fjae67U5u-3AXYqPu/pub?gid=0&single=true&output=csv';
const REFRESH_MS=5*60*1000;
const MAX_DROPDOWN=250, PARETO_BARS=30, PARETO_CUT=0.8;
// Header synonyms (normalised: lower-case letters and digits only). Earlier entries win ties.
const FIELDS={
  target:{label:'Target',syn:['sellouttarget','salestarget','target','targetsellout','targetsales','quota','salesquota','targetamount','targetvalue','selloutplan','plan','budget'],not:/achiev|gap|variance|status/},
  actual:{label:'Actual Sellout',syn:['actualsellout','actual','selloutactual','actualsales','actualnetsales','netsales','totalsellout','selloutvalue','selloutamount','actualamount','actualvalue','sellout','sales','amount'],
    not:/target|plan|budget|quota|gap|variance|achiev|status|person|man$|rep|agent|channel|format|customer|product|class|categ|store|outlet|name|code|date|region/},
  status:{label:'Status',syn:['status','performancestatus','targetstatus','achievementstatus','remarks'],not:/^$/},
  achv:{label:'Achievement %',syn:['achievement','achievementpct','achievementpercent','achievementrate','ach','attainment','percentachievement','achv'],not:/status/},
  gap:{label:'Gap',syn:['gap','selloutgap','variance','difference'],not:/^$/},
  date:{label:'Date',syn:['date','invoicedate','postingdate','transactiondate','selloutdate','reportdate','period','monthyear','yearmonth','month'],not:/target|actual|status/},
  sales:{label:'Salesperson',syn:['salesperson','salespersonname','salesman','salesmanname','salesrep','salesrepresentative','salesagent','salesname','seller','agent','kam','rep','salesmen'],not:/target|actual|status/},
  channel:{label:'Channel',syn:['channel','saleschannel','tradechannel','channelname','distributionchannel'],not:/target|actual|status/},
  format:{label:'Store Format',syn:['storeformat','format','outlettype','storetype','outletformat','storeformatname','outletclass','accounttype'],not:/target|actual|status/},
  product:{label:'Product Classification',syn:['productclassification','productclass','classification','productcategory','category','productgroup','productline','skuclassification'],not:/target|actual|status/},
  customer:{label:'Customer',syn:['customer','customername','account','accountname','outlet','outletname','storename','client','soldto','customerdescription','store'],not:/target|actual|status|format|type/}
};
const ORDER=['target','actual','status','achv','gap','date','sales','channel','format','product','customer'];
// Dimensions that get a filter, a chart and a KPI. Order = display order.
const DIMS=[
  {key:'sales',label:'Salesperson',one:'salesperson',many:'salespersons',horiz:true,
    act:'coach the weakest reps on coverage, call frequency and focus-SKU selling, and rebalance accounts from over- to under-served territories'},
  {key:'product',label:'Product Classification',one:'product classification',many:'product classifications',horiz:true,
    act:'review availability, pricing and promo support for the lagging classifications, and shift focus to the classifications already above target'},
  {key:'channel',label:'Channel',one:'channel',many:'channels',horiz:false,
    act:'revisit trade terms, distribution reach and key-account plans in the lagging channels'},
  {key:'format',label:'Store Format',one:'store format',many:'store formats',horiz:false,
    act:'tighten in-store execution (visibility, planogram, replenishment) in the weak formats and replicate what works in the leaders'},
  {key:'customer',label:'Customer',one:'customer',many:'customers',horiz:true,act:''}
];
const CARD_DIMS=['sales','product','channel','format'];

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fmt(n){ if(n==null||!isFinite(n)) return '–'; const a=Math.abs(n);
  return n.toLocaleString('en-US',{maximumFractionDigits:a<1000&&a%1?2:0}); }
const fmtP=v=>v==null||!isFinite(v)?'–':v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const compact=v=>{ const a=Math.abs(v); return a>=1e9?+(v/1e9).toFixed(1)+'B':a>=1e6?+(v/1e6).toFixed(1)+'M':a>=1e3?+(v/1e3).toFixed(1)+'K':String(+v.toFixed(1)); };

  s=s.replace(/[₱$€£,%\s]|php|usd/gi,'');

const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDate(s){

}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monthKey=d=>d.getFullYear()*12+d.getMonth();

const BANDNAME={g:'Hit Target',y:'Near Target',r:'Below Target',n:'No target'};
function statusBand(txt){

/* ---------- state ---------- */
const S={
  rows:[],headers:[],hrow:0,map:{},ovr:{},extra:[],numCols:new Set(),
  sel:{},dFrom:'',dTo:'',view:[],hasDate:false,
  sort:{},tq:'',tsort:null,page:0,pageSize:25,
  source:'',lastText:'',lastOk:null,loading:false,skipped:0,paretoAll:false,
  auto:store.get('sokpi-auto')!=='0'
};
const charts={};
try{ S.ovr=JSON.parse(store.get('sokpi-map')||'{}')||{}; }catch(e){ S.ovr={}; }

/* ---------- data: header detection ---------- */
function mapHeaders(hdr){
  const H=hdr.map(nz), used=new Set(), out={};
  for(const k of ORDER){ // pass 1: exact synonym match, earlier synonym = stronger
    const syn=FIELDS[k].syn; let best=-1,bs=-1;
    H.forEach((h,i)=>{ if(used.has(i)||!h) return; const p=syn.indexOf(h); if(p>=0&&syn.length-p>bs){bs=syn.length-p;best=i;} });
    if(best>=0){out[k]=best;used.add(best);}
  }
  for(const k of ORDER){ // pass 2: header contains a (long enough) synonym
    if(k in out) continue; const f=FIELDS[k]; let best=-1,bs=0;
    H.forEach((h,i)=>{ if(used.has(i)||!h||f.not.test(h)) return; f.syn.forEach(s=>{ if(s.length>=4&&h.includes(s)&&s.length>bs){bs=s.length;best=i;} }); });
    if(best>=0){out[k]=best;used.add(best);}
  }
  return out;
}
function detectHeaderRow(grid){
  let best=0,bs=-1;
  for(let r=0;r<Math.min(40,grid.length);r++){
    const m=mapHeaders(grid[r]); const sc=Object.keys(m).length+('target' in m&&'actual' in m?10:0);
    if(sc>bs){bs=sc;best=r;}
  }
  return best;
}
function applyOverrides(map,n){
  for(const k of Object.keys(S.ovr)){ const v=S.ovr[k]; if(v===-1) delete map[k]; else if(v>=0&&v<n){ for(const o of Object.keys(map)) if(map[o]===v&&o!==k) delete map[o]; map[k]=v; } }
}

/* ---------- data: ingest ---------- */
function ingest(grid){
  S.hrow=detectHeaderRow(grid);
  const hdr=(grid[S.hrow]||[]).map(h=>String(h==null?'':h).trim());
  const map=mapHeaders(hdr); applyOverrides(map,hdr.length);
  S.headers=hdr.map((h,i)=>h||('Column '+(i+1))); S.map=map;
  if(!('target' in map)||!('actual' in map)){ S.rows=[]; S.view=[]; return false; }
  const body=grid.slice(S.hrow+1), rows=[]; let skipped=0;
  const dimKeys=DIMS.map(d=>d.key).filter(k=>k in map);
  const dateIdx=map.date;
  for(const raw of body){
    const c=raw.map(x=>String(x==null?'':x).trim());
    if(!c.some(x=>x)) continue;
    const t=parseNum(c[map.target]), a=parseNum(c[map.actual]);
    const first=(c.find(x=>x)||'');
    if(/^(grand\s*|sub\s*)?total\b/i.test(first)||dimKeys.some(k=>/^(grand\s*|sub\s*)?total\b/i.test(c[map[k]]||''))){ skipped++; continue; }
    if(t==null&&a==null){ skipped++; continue; }
    const r={c,t:t==null?0:t,a:a==null?0:a,st:'status' in map?c[map.status]:''};
    for(const k of dimKeys) r[k]=c[map[k]]||'(Blank)';
    rows.push(r);
  }
  S.skipped=skipped; S.rows=rows;
  // dates: accept the column only if most values parse
  S.hasDate=false;
  if(dateIdx!=null){ let ok=0,tot=0; for(const r of rows){ const v=r.c[dateIdx]; if(!v) continue; tot++; const d=parseDate(v); if(d){ r.d=d; ok++; } }
    S.hasDate=tot>0&&ok/tot>=.6; if(!S.hasDate) for(const r of rows) r.d=null; }
  // numeric columns (for table alignment / sorting)
  S.numCols=new Set(); const sample=rows.slice(0,400);
  hdr.forEach((h,i)=>{ if(i===dateIdx&&S.hasDate) return; let n=0,v=0; for(const r of sample){ if(r.c[i]){ n++; if(parseNum(r.c[i])!=null) v++; } } if(n&&v/n>=.8) S.numCols.add(i); });
  for(const r of rows){ r.nv={}; S.numCols.forEach(i=>{ const v=parseNum(r.c[i]); if(v!=null) r.nv[i]=v; }); }
  // extra categorical columns become filters automatically (new sheet columns need no code change)
  const mapped=new Set(Object.values(map)); S.extra=[];
  hdr.forEach((h,i)=>{ if(mapped.has(i)||S.numCols.has(i)||!h) return; const set=new Set(); for(const r of rows){ const v=r.c[i]; if(v) set.add(v); if(set.size>30) break; }
    if(set.size>=2&&set.size<=30&&rows.length>set.size*2) S.extra.push({key:'x'+i,idx:i,label:S.headers[i]}); });
  S.rows.forEach(r=>{ r.s=null; });
  return true;
}

/* ---------- filters ---------- */
function filterDefs(){
  const defs=[]; DIMS.forEach(d=>{ if(d.key in S.map) defs.push({key:d.key,label:d.label,get:r=>r[d.key]}); });
  S.extra.forEach(x=>defs.push({key:x.key,label:x.label,get:r=>r.c[x.idx]||'(Blank)'}));
  return defs;
}
function valuesOf(def){ const set=new Set(); for(const r of S.rows) set.add(def.get(r)); return [...set].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})); }
function applyFilters(){
  const defs=filterDefs().filter(d=>S.sel[d.key]);
  const df=S.dFrom?new Date(S.dFrom+'T00:00:00'):null, dt=S.dTo?new Date(S.dTo+'T23:59:59'):null;
  S.view=S.rows.filter(r=>{
    for(const d of defs){ if(!S.sel[d.key].has(d.get(r))) return false; }
    if(S.hasDate&&(df||dt)){ if(!r.d) return false; if(df&&r.d<df) return false; if(dt&&r.d>dt) return false; }
    return true;
  });
}
function buildFilters(){
  const g=$('fGrid'); g.innerHTML='';

  S.defs=[];
  filterDefs().forEach(def=>{
    S.defs.push(def); def.values=valuesOf(def);
    const cur=S.sel[def.key]; if(cur){ const keep=new Set([...cur].filter(v=>def.values.includes(v))); S.sel[def.key]=keep.size&&keep.size<def.values.length?keep:null; }
    g.appendChild(makeMS(def));
  });
  if(S.hasDate){
    const ds=S.rows.map(r=>r.d).filter(Boolean).map(d=>+d), mn=ymd(new Date(Math.min(...ds))), mx=ymd(new Date(Math.max(...ds)));
    ['From','To'].forEach(w=>{ const el=document.createElement('label'); el.className='dt'; el.innerHTML=`<span>Date ${w.toLowerCase()}</span><input type="date" min="${mn}" max="${mx}" value="${w==='From'?S.dFrom:S.dTo}" data-d="${w}">`;
      el.querySelector('input').addEventListener('change',e=>{ S[w==='From'?'dFrom':'dTo']=e.target.value; update(); }); g.appendChild(el); });
  } else { S.dFrom=S.dTo=''; }
}
function makeMS(def){

  <label class="ms-all"><input type="checkbox"><span>Select All</span></label><div class="ms-list"></div></div>`;
  const btn=el.querySelector('.ms-b'), pan=el.querySelector('.ms-p'), q=el.querySelector('.ms-s'), all=el.querySelector('.ms-all input'), list=el.querySelector('.ms-list'), allT=el.querySelector('.ms-all span');

    v.textContent=!s?`All (${def.values.length})`:s.size===1?[...s][0]:`${s.size} selected`; btn.classList.toggle('on',!!s); };
  const draw=()=>{
    const t=q.value.trim().toLowerCase(); hits=t?def.values.filter(v=>String(v).toLowerCase().includes(t)):def.values;
    const s=S.sel[def.key]; allT.textContent=t?'Select all results':'Select All';
    all.checked=hits.length>0&&(t?(!!s&&hits.every(v=>s.has(v))):(!s||s.size>=def.values.length)); 
    list.innerHTML=hits.slice(0,MAX_DROPDOWN).map(v=>`<label><input type="checkbox" value="${esc(v)}" ${!s||s.has(v)?'checked':''}> <span>${esc(v)}</span></label>`).join('')
      +(hits.length>MAX_DROPDOWN?`<div class="ms-note">+${hits.length-MAX_DROPDOWN} more. Type to narrow the list.</div>`:'')+(hits.length?'':'<div class="ms-note">No matches</div>');
  };
  const commit=s=>{ S.sel[def.key]=s&&s.size<def.values.length?s:null; val(); update(); };
  all.addEventListener('change',()=>{ const t=q.value.trim();
    if(!t){ commit(all.checked?null:new Set()); } else { const cur=new Set(S.sel[def.key]||[]); if(all.checked){ commit(new Set(hits)); } else { hits.forEach(h=>cur.delete(h)); commit(cur); } }
    draw(); });
  list.addEventListener('change',e=>{ const cb=e.target; if(cb.type!=='checkbox') return; const cur=new Set(S.sel[def.key]||def.values);
    cb.checked?cur.add(cb.value):cur.delete(cb.value); commit(cur); draw(); });
  q.addEventListener('input',draw);
  btn.addEventListener('click',()=>{ const open=pan.hidden; closeMS(); if(open){ pan.hidden=false; btn.setAttribute('aria-expanded','true'); q.value=''; draw(); q.focus({preventScroll:true}); } });

function closeMS(){ document.querySelectorAll('.ms-p').forEach(p=>{ p.hidden=true; p.parentNode.querySelector('.ms-b').setAttribute('aria-expanded','false'); }); }
document.addEventListener('click',e=>{ if(!e.target.closest('.ms')) closeMS(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeMS(); const fs=document.querySelector('.card.fs'); if(fs) toggleFs(fs.id.replace('card-','')); } });
function renderChips(){

/* ---------- aggregation ---------- */
function groupBy(rows,key){
  const m=new Map();
  for(const r of rows){ const k=r[key]; let g=m.get(k); if(!g){ g={name:k,t:0,a:0,n:0}; m.set(k,g); } g.t+=r.t; g.a+=r.a; g.n++; }
  const out=[...m.values()]; out.forEach(fin); return out;
}
function fin(g){ g.gap=g.a-g.t; g.ach=g.t>0?g.a/g.t*100:null; g.band=band(g.ach); return g; }
function total(rows){ const g={name:'Total',t:0,a:0,n:rows.length}; for(const r of rows){ g.t+=r.t; g.a+=r.a; } return fin(g); }
const SORTS={'ach-desc':['Achievement % high-low',(x,y)=>(y.ach==null?-1e18:y.ach)-(x.ach==null?-1e18:x.ach)],
  'ach-asc':['Achievement % low-high',(x,y)=>(x.ach==null?1e18:x.ach)-(y.ach==null?1e18:y.ach)],
  'act-desc':['Actual high-low',(x,y)=>y.a-x.a],'act-asc':['Actual low-high',(x,y)=>x.a-y.a],
  'gap-asc':['Largest shortfall first',(x,y)=>x.gap-y.gap],'gap-desc':['Largest surplus first',(x,y)=>y.gap-x.gap],
  'name':['Name A-Z',(x,y)=>String(x.name).localeCompare(String(y.name),undefined,{numeric:true})]};
function monthTotals(){
  if(!S.hasDate) return [];
  const m=new Map(); for(const r of S.view){ if(!r.d) continue; const k=monthKey(r.d); let g=m.get(k); if(!g){ g={k,t:0,a:0}; m.set(k,g); } g.t+=r.t; g.a+=r.a; }
  return [...m.values()].sort((x,y)=>x.k-y.k).map(g=>(g.ach=g.t>0?g.a/g.t*100:null,g));
}

/* ---------- insights (rule-based) ---------- */
function bandOfGap(g){ return g>=0?'g':'r'; }
function share(x,tot){ return tot>0?(x/tot*100):0; }
function insightRows(d,gs){
  const rows=[]; if(!gs.length) return rows;
  const T=gs.reduce((s,g)=>(s.t+=g.t,s.a+=g.a,s),{t:0,a:0}), ach=T.t>0?T.a/T.t*100:null, gap=T.a-T.t;
  const w=gs.filter(g=>g.ach!=null).sort((x,y)=>y.ach-x.ach);
  const hit=w.filter(g=>g.ach>=100), near=w.filter(g=>g.ach>=90&&g.ach<100), below=w.filter(g=>g.ach<90).sort((x,y)=>x.gap-y.gap);
  const top=w[0], low=w[w.length-1];
  const nm=gs.length===1?d.one:d.many, names=a=>a.slice(0,3).map(g=>g.name).join(', ')+(a.length>3?' +'+(a.length-3)+' more':'');
  rows.push({k:'Key Finding',b:band(ach),v:`${gs.length} ${nm} delivered ${fmtP(ach)} of target (${fmt(T.a)} vs ${fmt(T.t)}). ${hit.length} reached target, ${near.length} are near target and ${below.length} are below 90%.`});
  rows.push({k:'Top Performer',b:top?top.band:'n',v:top?`${top.name} at ${fmtP(top.ach)} (${fmt(top.a)} vs ${fmt(top.t)}).`:'No target data available.'});
  rows.push({k:'Lowest Performer',b:low?low.band:'n',v:low?`${low.name} at ${fmtP(low.ach)} (${fmt(low.a)} vs ${fmt(low.t)}), a gap of ${fmt(low.gap)}.`:'No target data available.'});
  const sf=gs.filter(g=>g.gap<0).sort((x,y)=>x.gap-y.gap), totSf=sf.reduce((s,g)=>s+(-g.gap),0);
  rows.push({k:'Gap Analysis',b:bandOfGap(gap),v:(gap>=0?`Combined surplus of ${fmt(gap)} versus target. `:`Combined shortfall of ${fmt(-gap)} versus target. `)+
    (sf.length?`Largest gap: ${sf[0].name}, short by ${fmt(-sf[0].gap)} (${fmtP(share(-sf[0].gap,totSf))} of all shortfalls; ${sf.length} of ${gs.length} below target).`:'No ' +d.one+' is below target.')});
  rows.push({k:'Risk Area',b:below.length?'r':near.length?'y':'g',v:below.length?`${below.length} ${below.length===1?d.one:d.many} below 90%: ${names(below)}. Combined shortfall ${fmt(below.reduce((s,g)=>s-g.gap,0))}.`
    :near.length?`None below 90%. Watch the ${near.length} near target (${names(near)}), as small slippage turns them red.`:'No risk area: every '+d.one+' with a target is at or above 100%.'});
  rows.push({k:'Recommended Action',b:'n',v:below.length?`Prioritize ${names(below)}: ${d.act||'agree a recovery plan and track it weekly against the remaining target'}.`
    :near.length?`Close the last mile on ${names(near)} with a targeted push before period end, and keep weekly tracking.`:'Maintain momentum, document what is working, and consider stretch targets for the leaders.'});
  if(d.key==='sales'&&w.length){ const avg=w.reduce((s,g)=>s+g.ach,0)/w.length;
    rows.push({k:'Average Achievement',b:band(avg),v:`${fmtP(avg)} average across ${w.length} salespersons (simple average of individual achievement); ${hit.length} above target, ${w.length-hit.length} below.`}); }
  if(d.key==='product'&&w.length){ const g=hit.map(x=>x.name), l=w.filter(x=>x.ach<100);
    rows.push({k:'Growth Opportunities',b:'n',v:(g.length?`Above target: ${names(hit)}. Extend distribution and stretch targets there. `:'')+(l.length?`Largest room to grow: ${names(l.sort((x,y)=>x.gap-y.gap))}.`:'')}); }
  return rows;
}
function paretoData(){
  const gs=groupBy(S.view,'customer').filter(g=>g.a>0).sort((x,y)=>y.a-x.a);
  const tot=gs.reduce((s,g)=>s+g.a,0); let cum=0,n80=0;
  gs.forEach((g,i)=>{ g.share=tot>0?g.a/tot*100:0; const before=cum; cum+=g.share; g.cum=cum; g.rank=i+1; g.vital=before<PARETO_CUT*100-1e-9; if(g.vital) n80++; });
  return {gs,tot,n80};
}
function paretoInsights(P){
  const {gs,tot,n80}=P; if(!gs.length) return [];
  const top=gs[0], low=gs[gs.length-1], t5=gs.slice(0,5).reduce((s,g)=>s+g.share,0);
  const risk=top.share>=25||t5>=70?'High':top.share>=15||t5>=50?'Moderate':'Low';
  const withT=gs.filter(g=>g.t>0), gap=withT.reduce((s,g)=>s+g.gap,0);
  return [
    {k:'Key Finding',b:'n',v:`${n80} of ${gs.length} customers (${fmtP(n80/gs.length*100)}) contribute 80% of total sales (${fmt(tot)}).`},
    {k:'Top Performer',b:'g',v:`${top.name} contributes ${fmtP(top.share)} (${fmt(top.a)}).`},
    {k:'Lowest Performer',b:'n',v:`${low.name} contributes ${fmtP(low.share)} (${fmt(low.a)}), the smallest active customer.`},
    {k:'Gap Analysis',b:withT.length?bandOfGap(gap):'n',v:withT.length?`Customers with a target are ${gap>=0?'ahead by '+fmt(gap):'short by '+fmt(-gap)} versus target. ${withT.filter(g=>g.gap<0&&g.vital).length} of the 80% customers are below target.`:'No customer-level targets in the data, so the gap is measured at the salesperson, channel, format and product level.'},
    {k:'Customer Concentration Risk',b:risk==='High'?'r':risk==='Moderate'?'y':'g',v:`${risk}. The top customer holds ${fmtP(top.share)} and the top 5 hold ${fmtP(t5)} of sales.`},
    {k:'Recommended Actions',b:'n',v:`Protect the ${n80} key accounts with joint business plans and service-level checks; `+(risk!=='Low'?'reduce dependence by growing mid-tier accounts; ':'')+`review the long tail (${gs.length-n80} customers, ${fmtP(100-(gs[n80-1]?gs[n80-1].cum:0))} of sales) for low-cost coverage.`}

    const imgs={}; ['sales','product','channel','format','pareto'].forEach(id=>{ const c=charts[id]; if(c&&!c.isDisposed()&&!$('ch-'+id).hidden) imgs[id]={url:c.getDataURL({type:'jpeg',pixelRatio:2,backgroundColor:'#ffffff'}),w:c.getWidth(),h:c.getHeight()}; });
    const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'}), W=297, M=14; let y=0;
    const head=t=>{ doc.setFillColor(0,87,160); doc.rect(0,0,W,16,'F'); doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(clean(t),M,10.5); doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.text('FAST Unimerchant Inc.',W-M,10.5,{align:'right'}); doc.setTextColor(20,36,58); y=24; };
    const para=(txt,size=9,bold=false)=>{ doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(size); const ls=doc.splitTextToSize(clean(txt),W-2*M); ls.forEach(l=>{ if(y>198){ doc.addPage(); head('Sellout KPI Dashboard (continued)'); doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(size); } doc.text(l,M,y); y+=size*0.45+1.4; }); };
    head('Sellout KPI Dashboard');
    para('Exported: '+new Date().toLocaleString()+'   |   Records: '+fmt(S.view.length)+' of '+fmt(S.rows.length),9);
    para('Filters applied: '+filterSummary(),9); y+=3;
    const RGB={g:[30,158,90],y:[242,194,0],r:[214,40,40],n:[0,87,160]}, bw=(W-2*M-9)/4;
    (S.kpiList||[]).forEach((k,i)=>{ const x=M+(i%4)*(bw+3), yy=y+Math.floor(i/4)*24; doc.setDrawColor(200,208,220); doc.rect(x,yy,bw,21); doc.setFillColor(...RGB[k.c]); doc.rect(x,yy,2,21,'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(90,106,126); doc.text(clean(k.l).toUpperCase(),x+5,yy+5);
      doc.setFont('helvetica','bold'); doc.setFontSize(k.sm?10:13); doc.setTextColor(20,36,58); doc.text(doc.splitTextToSize(clean(k.v),bw-8)[0],x+5,yy+12.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(90,106,126); doc.text(doc.splitTextToSize(clean(k.s||''),bw-8)[0]||'',x+5,yy+18); });
    y+=52; doc.setTextColor(20,36,58); para('Executive Insights',11,true);
    (S.topText||[]).forEach(t=>para('- '+t,9));
    const sections=[['sales','Salesperson Performance',()=>insightRows(DIMS[0],groupBy(S.view,'sales'))],['product','Product Classification Performance',()=>insightRows(DIMS[1],groupBy(S.view,'product'))],
      ['channel','Channel Performance',()=>insightRows(DIMS[2],groupBy(S.view,'channel'))],['format','Store Format Performance',()=>insightRows(DIMS[3],groupBy(S.view,'format'))],
      ['pareto','Pareto Analysis: Top Customers (80/20)',()=>paretoInsights(S.pareto||paretoData())]];
    for(const [id,title,fn] of sections){ if(!imgs[id]) continue; doc.addPage(); head(title); const im=imgs[id]; const maxH=108, maxW=W-2*M; let w=maxW,h=w*im.h/im.w; if(h>maxH){ h=maxH; w=h*im.w/im.h; }
      doc.addImage(im.url,'JPEG',M+(maxW-w)/2,y-4,w,h); y+=h+2; fn().forEach(r=>para(r.k+': '+r.v,8.5)); }
    doc.save('sellout-kpi-dashboard.pdf');
  }catch(e){ console.error(e); toast('Could not create the PDF: '+e.message); }
  finally{ S.noAnim=false; if(prevTheme) document.documentElement.setAttribute('data-theme',prevTheme); else document.documentElement.removeAttribute('data-theme'); renderAllCharts(); btn.disabled=false; btn.textContent='Download PDF'; }
}

/* ---------- app: load, render, wiring ---------- */
function showMsg(html,info){ const m=$('msg'); m.className='banner'+(info?' info':''); m.innerHTML=html; m.hidden=false; }
function hideMsg(){ $('msg').hidden=true; }
function setSource(kind,txt){ $('dot').className='dot '+kind; $('srcTxt').textContent=txt; }
function setLoading(on){ S.loading=on; $('bar').classList.toggle('on',on); $('spin').hidden=!on; $('refresh').disabled=on; }
async function load(manual){
  if(S.loading) return; setLoading(true);
  try{
    const res=await fetch(SHEET_URL+'&_='+Date.now(),{cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text(); if(/^\s*<(!doctype|html)/i.test(text)) throw new Error('Google returned a web page instead of CSV. Check that the sheet is published to the web as CSV.');
    S.lastOk=new Date(); S.source='live';
    if(text!==S.lastText||manual||!S.rows.length){ S.lastText=text; apply(parseCsv(text)); } else { setSource('ok','Live data (no changes)'); }
    setSource('ok','Live: Google Sheets'); $('updated').textContent='Last updated '+S.lastOk.toLocaleString();
  }catch(e){
    console.warn(e);
    if(S.rows.length){ setSource('bad','Refresh failed, showing earlier data'); showMsg(`<b>Could not refresh the data.</b> ${esc(e.message)}. Showing the last successful load${S.lastOk?' from '+esc(S.lastOk.toLocaleString()):''}. <div class="row"><button class="btn sm primary" id="retry">Retry</button></div>`); }
    else { setSource('bad','Data unavailable'); $('main').hidden=true; showMsg(`<b>Could not load the Google Sheet.</b> ${esc(e.message)}. The sheet must be published to the web as CSV and your browser must be online. <div class="row"><button class="btn sm primary" id="retry">Retry</button><button class="btn sm" id="pick">Load a CSV file instead</button></div>`); $('updated').textContent='No data loaded'; }
  }finally{ setLoading(false); }
}
function parseCsv(text){ if(!window.Papa) throw new Error('CSV library (PapaParse) did not load.'); const r=Papa.parse(text,{skipEmptyLines:'greedy'}); return r.data; }
function apply(grid){
  S.grid=grid; const ok=ingest(grid); hideMsg();
  if(!ok){ $('main').hidden=true; renderFoot(true); showMsg(`<b>Could not find the Target and Actual columns.</b> Headers found: ${esc(S.headers.filter(Boolean).join(' | ')||'none')}. Use "Column detection" at the bottom of the page to point the dashboard to the right columns.`); return; }
  $('main').hidden=false; buildCards(); buildFilters(); S.page=0; update(); renderFoot(false);
}
function buildCards(){
  Object.keys(charts).forEach(k=>{ if(CARD_DIMS.includes(k)&&charts[k]&&!charts[k].isDisposed()){ charts[k].dispose(); delete charts[k]; } });
  const sub={sales:'Target (wide bar) vs Actual (colored bar) with the remaining gap dashed. Click a bar to filter.',product:'Target vs Actual by product classification. Click a bar to filter.',
    channel:'Target vs Actual by sales channel. Click a bar to filter.',format:'Target vs Actual by store format. Click a bar to filter.'};
  $('cards').innerHTML=CARD_DIMS.filter(k=>k in S.map).map(k=>{ const d=DIMS.find(x=>x.key===k);
    return `<article class="card" id="card-${k}"><div class="card-h"><div><h2>${d.label} Performance</h2><p class="sub">${sub[k]} ★ top, ▼ lowest.</p></div>
      <div class="tools"><select class="sel" data-sort="${k}" aria-label="Sort ${d.label} chart">${Object.keys(SORTS).map(s=>`<option value="${s}" ${((S.sort[k]||'ach-desc')===s)?'selected':''}>${SORTS[s][0]}</option>`).join('')}</select>
      <button class="btn sm" data-png="${k}">PNG</button><button class="btn sm" data-fs="${k}">Full screen</button></div></div>
      <div class="chart" id="ch-${k}"></div><div class="empty" id="em-${k}" hidden></div><div class="ins" id="ins-${k}"></div></article>`; }).join('');
}
let raf=0; function update(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(render); }
function render(){
  if(!S.rows.length) return; applyFilters(); renderChips(); (S.defs||[]).forEach(d=>d.refresh&&d.refresh());
  const none=!S.view.length; if(none) showMsg(`<b>No records match the current filters.</b> <div class="row"><button class="btn sm primary" id="clearAll">Clear all filters</button></div>`,true); else if($('msg').classList.contains('info')) hideMsg();
  renderKpis(); renderTop(); renderAllCharts(); renderTable();
}
function renderFoot(bad){
  const m=S.map, name=k=>k in m?esc(S.headers[m[k]]):'<i>not found</i>';
  const sel=ORDER.map(k=>`<label>${FIELDS[k].label}<select class="sel" data-map="${k}"><option value="-2">Auto-detect</option><option value="-1" ${S.ovr[k]===-1?'selected':''}>None</option>${S.headers.map((h,i)=>`<option value="${i}" ${S.ovr[k]===i?'selected':''}>${esc(h)}${m[k]===i?' (current)':''}</option>`).join('')}</select></label>`).join('');
  $('foot').innerHTML=`<div>${bad?'':`${fmt(S.rows.length)} records loaded${S.skipped?` (${fmt(S.skipped)} blank/total rows skipped)`:''}. Header row detected at line ${S.hrow+1}. `}`+
   `Detected: ${ORDER.map(k=>`${FIELDS[k].label} → ${name(k)}`).join(' · ')}.${S.extra.length?` Extra filters from new columns: ${S.extra.map(x=>esc(x.label)).join(', ')}.`:''}${S.hasDate?'':' No usable date column, so date filter and trends are off.'}</div>
   <details ${bad?'open':''}><summary>Column detection (override if a column was matched wrongly)</summary><div class="map-grid">${sel}</div></details>`;
}
function setTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
function isDark(){ const t=document.documentElement.getAttribute('data-theme'); return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches; }
function themeBtn(){ $('theme').textContent=isDark()?'Light mode':'Dark mode'; }
function schedule(){ clearInterval(S.timer); if(S.auto) S.timer=setInterval(()=>{ if(!document.hidden) load(false); },REFRESH_MS); }

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#retry')) load(true);
  else if(t.closest('#pick')) $('file').click();
  else if(t.closest('#clearAll')){ S.sel={}; S.dFrom=S.dTo=''; buildFilters(); update(); }
  else if(t.closest('[data-clr]')){ clearFilter(t.closest('[data-clr]').dataset.clr); update(); }
  else if(t.closest('[data-png]')){ const id=t.closest('[data-png]').dataset.png, c=charts[id]; if(c&&!c.isDisposed()) download(id+'-chart.png',c.getDataURL({type:'png',pixelRatio:2,backgroundColor:cssv('--surface')})); else toast('Nothing to export for this chart.'); }
  else if(t.closest('[data-fs]')) toggleFs(t.closest('[data-fs]').dataset.fs);
  else if(t.closest('th[data-col]')){ const id=t.closest('th').dataset.col; S.tsort=S.tsort&&S.tsort.id===id?{id,dir:S.tsort.dir==='asc'?'desc':'asc'}:{id,dir:'asc'}; renderTable(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.sort){ S.sort[t.dataset.sort]=t.value; renderCards(); }
  else if(t.dataset&&t.dataset.map!==undefined){ const v=+t.value; if(v===-2) delete S.ovr[t.dataset.map]; else S.ovr[t.dataset.map]=v; store.set('sokpi-map',JSON.stringify(S.ovr)); if(S.grid) apply(S.grid); }
});
$('refresh').addEventListener('click',()=>load(true));
$('pdf').addEventListener('click',exportPdf);
$('xCsv').addEventListener('click',exportCsv); $('xXlsx').addEventListener('click',exportXlsx);
$('theme').addEventListener('click',()=>{ const t=isDark()?'light':'dark'; setTheme(t); store.set('sokpi-theme',t); themeBtn(); renderAllCharts(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ themeBtn(); renderAllCharts(); });
$('auto').addEventListener('change',e=>{ S.auto=e.target.checked; store.set('sokpi-auto',S.auto?'1':'0'); schedule(); });
$('fClear').addEventListener('click',()=>{ S.sel={}; S.dFrom=S.dTo=''; buildFilters(); update(); });
$('fToggle').addEventListener('click',()=>{ const g=$('fGrid'), c=g.classList.toggle('closed'); $('fToggle').setAttribute('aria-expanded',String(!c)); });
$('tq').addEventListener('input',e=>{ S.tq=e.target.value; S.page=0; renderTable(); });
$('pgSize').addEventListener('change',e=>{ S.pageSize=+e.target.value; S.page=0; renderTable(); });
$('pgPrev').addEventListener('click',()=>{ S.page=Math.max(0,S.page-1); renderTable(); });
$('pgNext').addEventListener('click',()=>{ S.page++; renderTable(); });
$('paretoMore').addEventListener('click',()=>{ S.paretoAll=!S.paretoAll; renderPareto(); });
$('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ S.lastText=''; apply(parseCsv(String(rd.result))); setSource('file','File: '+f.name); $('updated').textContent='Loaded from file '+f.name+' at '+new Date().toLocaleString(); }catch(err){ showMsg('<b>Could not read that file.</b> '+esc(err.message)); } }; rd.readAsText(f); e.target.value=''; });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.auto&&S.lastOk&&Date.now()-S.lastOk>REFRESH_MS) load(false); });
if(window.matchMedia('(max-width:720px)').matches){ $('fGrid').classList.add('closed'); $('fToggle').setAttribute('aria-expanded','false'); }

(function init(){
  const th=store.get('sokpi-theme'); if(th) setTheme(th); themeBtn(); $('auto').checked=S.auto; schedule();
  if(!window.echarts){ showMsg('<b>The chart library (ECharts) could not be loaded.</b> Check your internet connection and reload.'); return; }
  load(true);
})();
})();
</script>
